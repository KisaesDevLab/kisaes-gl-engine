name: CI

# Gate main + PRs on the engine's typecheck and full test matrix
# (packages/api + packages/shared). The web, worker and e2e jobs live in
# MyBooks Online (Vibe-MyBooks), which pins this repository as a submodule.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        # --ignore-scripts avoids running Puppeteer's Chromium download
        # and husky hook install during CI; neither is needed for
        # typecheck / test, and the workflow explicitly performs
        # anything it needs below.
        run: npm ci --ignore-scripts
      - name: Build shared
        run: npm run build --workspace=@kis-books/shared
      - name: Typecheck api
        run: npx tsc --noEmit
        working-directory: packages/api
      - name: Guard against new `any` types
        # CLAUDE.md #14 bans `any`; we carry a baseline for pre-existing
        # occurrences and this step fails the build if the count grows.
        # Debt paydown is expected (the script prints "update BASELINE_*").
        run: npm run any:check
      - name: OpenAPI spec is current
        # Regenerates openapi.json from the route registrations (no DB or
        # Redis needed) and fails if the committed file differs. Fix with
        # `npm run openapi:export` and commit the result.
        run: npm run openapi:check

  test:
    # The api suite is ~560 DB-backed files run serially (singleFork, shared
    # DB), ~26 min on one runner. Split it across shards; each shard has its
    # own postgres + redis service so the single-DB assumption still holds.
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      # Mirror the dev/test DB setup. test-setup.ts points vitest at
      # postgresql://kisbooks:kisbooks@localhost:5434/kisbooks_test —
      # align the port/creds with that URL so the same code paths run.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kisbooks
          POSTGRES_PASSWORD: kisbooks
          POSTGRES_DB: kisbooks_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kisbooks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # test-setup.ts never defaults to the production Redis port (D13): CI
      # supplies the TEST instance on 6390 that the estimate / snapshot / portal
      # cache tests expect.
      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build shared
        run: npm run build --workspace=@kis-books/shared
      - name: Run migrations against test DB
        env:
          DATABASE_URL: postgresql://kisbooks:kisbooks@localhost:5434/kisbooks_test
        # migrate.ts resolves the migrations folder via import.meta.url
        # so it works from any cwd. Repo root is fine.
        run: npx tsx packages/api/src/migrate.ts
      - name: Run api unit tests
        env:
          DATABASE_URL: postgresql://kisbooks:kisbooks@localhost:5434/kisbooks_test
          REDIS_URL: redis://127.0.0.1:6390
          JWT_SECRET: test-secret-key-for-testing-only
        run: npx vitest run --shard=${{ matrix.shard }}/4
        working-directory: packages/api
      # shared is small; run it once, on shard 1.
      - name: Run shared unit tests
        if: matrix.shard == 1
        run: npm test
        working-directory: packages/shared

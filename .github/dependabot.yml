#
# Weekly dependency PRs. Security updates open immediately regardless of
# the schedule. Grouped so a week's minor/patch bumps arrive as one PR per
# ecosystem instead of dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Security updates (repo setting "Dependabot security updates" is on)
    # open as soon as an advisory lands, one PR per package. Deliberately
    # NOT grouped: a grouped security job fails as a whole when any one fix
    # needs a major upgrade (tinypool → vitest 4), and then none arrive.
    ignore:
      # Majors are reviewed by hand (puppeteer 25 changes the browser
      # download/launch contract; react-router 7 is a routing rewrite).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
